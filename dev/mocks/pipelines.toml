# Scenario 5: pipelines.lsst.io, whose editions are named by EUPS tags.
# The main edition tracks the newest final release (eups_release mode),
# `weekly` and `daily` track the newest weekly and daily tags, numbered
# releases include two-component and legacy hyphenated slugs migrated from
# LTD (`v17_0`, `13-0`), weeklies include legacy `w-YYYY-WW` slugs, and
# dailies, a release candidate and a ticket branch are drafts.
title = "EUPS releases, weeklies, and dailies (pipelines)"

[org]
slug = "rubin"
title = "Rubin Observatory"
base_domain = "lsst.io"

[project]
slug = "pipelines"
title = "LSST Science Pipelines"
source_repo_url = "https://github.com/lsst/pipelines_lsst_io"
published_url = "https://pipelines.lsst.io/"

# Main and the meta editions that track the newest tag of each kind.

[[editions]]
slug = "__main"
title = "Latest release"
kind = "main"
date_updated = 2026-10-21T18:40:00Z
build = { git_ref = "v30_0_11", date = 2026-10-21T18:38:12Z }

[[editions]]
